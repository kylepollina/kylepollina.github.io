# GitHub Pages (Jekyll) settings. The old site is built by old-site/build_site.py.
# old-site/content/ can't be excluded yet: sketch pages load their JS from it.
exclude:
  - TODO.md
  - CLAUDE.md
  - docs/
  - README.md
  - serve.py
  - package.json
  - scripts/
  - old-site/research/  # hidden for now; see HIDDEN_PAGES in old-site/build_site.py
  - old-site/biology-logs/
  - old-site/templates/
  - old-site/build_site.py
  - old-site/logger.py
  - old-site/requirements.txt
  - old-site/package.json
  - old-site/package-lock.json
  - old-site/tailwind.config.js
  - old-site/index.tailwind.css
  - old-site/node_modules/
  - old-site/env/
