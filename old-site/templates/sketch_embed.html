<!DOCTYPE html>
<!-- Bare sketch page, built by content/interactive/__init__.py for the gallery iframes -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    body { display: flex; align-items: center; justify-content: center; }
    /* Shrink the canvas to fit the iframe; p5 sets width/height inline, hence !important */
    canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto !important; height: auto !important; }
  </style>
  {% for script in scripts %}
  <script src="{{ script }}"></script>
  {% if script.endswith('p5.min.js') %}<script src="{{ root }}scripts/sketches/embed.js"></script>{% endif %}
  {% endfor %}
</head>
<body>
  <div id="{{ holder }}"></div>
</body>
</html>
