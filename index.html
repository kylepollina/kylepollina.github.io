<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kyle pollina</title>
        <link rel="icon" type="image/png" href="favicon.png" />
        <!-- Fraunces, SIL Open Font License: https://fonts.google.com/specimen/Fraunces -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&display=block"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="site.css" />
        <style>
            /* The name is centered and fills the window; the links hang in a row under it */
            body {
                height: 100vh;
                padding: 0;
                overflow: hidden;
                display: grid;
                place-items: center;
            }
            main {
                max-width: none;
            }
            /* "kyle pollina" in Fraunces 800 is 4.86em wide, so this is 84% of the width, or 62% of the height */
            h1 {
                margin: 0;
                /* Room for the y's tail, which hangs below the line box */
                padding-bottom: 0.18em;
                font-size: min(17.2vw, 62vh);
                text-align: center;
                white-space: nowrap;
            }
            /* Stacked on tall screens; "pollina" is 2.93em wide */
            @media (max-aspect-ratio: 11/10) {
                h1 {
                    font-size: min(28.6vw, 31vh);
                    line-height: 1.1;
                }
                h1 span {
                    display: block;
                }
            }
            /* The row spans the name; class="right" pins a link to its right edge, and it drops to a
               second row (still on the right) when there isn't room */
            nav {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                display: flex;
                flex-wrap: wrap;
                column-gap: 1.5em;
                font-size: 36px;
            }
            nav .right {
                margin-left: auto;
            }
            @media (max-width: 640px) {
                nav {
                    font-size: 24px;
                }
            }
        </style>
    </head>

    <body>
        <!-- Bigger dots here than on the other pages -->
        <canvas id="dither" data-cell="3" data-cell-phone="2"></canvas>
        <main>
            <h1><span>kyle</span> <span>pollina</span></h1>
            <nav>
                <a href="photography.html">photography</a>
                <a href="apps.html">apps</a>
                <a href="about.html" class="right">about</a>
            </nav>
        </main>
        <script src="dither.js"></script>
    </body>
</html>
