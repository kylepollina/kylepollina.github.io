<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kyle pollina</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Fraunces, SIL Open Font License: https://fonts.google.com/specimen/Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&display=block" rel="stylesheet">
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: italic;
      src: url("fonts/IBMPlex/IBMPlexMono-Italic.otf") format("opentype");
    }
    /* Keep in step with THEMES in the script */
    :root { --ink: #111; --paper: #ece8dc; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #d6d0c0; --paper: #161513; }
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* The name is drawn on the canvas; this copy is for screen readers and search */
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    /* The label is drawn on the canvas. This invisible link sits exactly over it (layout() sizes it)
       so clicks, keyboard focus and screen readers still work */
    #photo-link {
      position: fixed;
      display: none;
      color: transparent;
      overflow: hidden;
      outline: none;
    }
  </style>
</head>

<body>
  <h1>kyle pollina</h1>
  <canvas id="c"></canvas>
  <nav>
    <a id="photo-link" href="photography.html">photography</a>
  </nav>

  <script>
    const NAME = "kyle pollina";
    const FONT = "Fraunces";
    const LABEL = "photography";
    const LABEL_FONT = '"IBM Plex Mono"';
    const LABEL_SIZE = 12;     // label height in dither pixels; below about 8 it stops being readable
    // Follow the system theme. Dark mode isn't a straight swap: light dots on black read heavier,
    // so the cream is dimmer and the grain and glow lighter, and the band flips so it still brightens
    const THEMES = {
      light: { ink: [17, 17, 17], paper: [236, 232, 220], grain: 0.07, glow: 0.45, letter: 0.06, band: 0.55 },
      dark: { ink: [214, 208, 192], paper: [22, 21, 19], grain: 0.035, glow: 0.3, letter: 0.2, band: -0.35 },
    };
    const darkMode = matchMedia("(prefers-color-scheme: dark)");
    let theme;
    const applyTheme = () => { theme = darkMode.matches ? THEMES.dark : THEMES.light; };
    applyTheme();
    darkMode.addEventListener("change", applyTheme);
    let CELL = 3;              // screen pixels per dither pixel (2 on phones, set in layout)

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    // 8x8 Bayer matrix for the ordered dither
    const BAYER = (() => {
      let m = [[0]];
      while (m.length < 8) {
        const n = m.length, next = [];
        for (let y = 0; y < n * 2; y++) {
          next.push([]);
          for (let x = 0; x < n * 2; x++) {
            const base = 4 * m[y % n][x % n];
            next[y].push(base + [0, 2, 3, 1][(y < n ? 0 : 2) + (x < n ? 0 : 1)]);
          }
        }
        m = next;
      }
      return m.map((row) => row.map((v) => (v + 0.5) / 64));
    })();

    let W, H, img, core, halo, label;

    // The canvas label shows its hover state when the invisible link over it is hovered or focused
    const link = document.getElementById("photo-link");
    let hover = false;
    link.addEventListener("pointerenter", () => { hover = true; });
    link.addEventListener("pointerleave", () => { hover = false; });
    link.addEventListener("focus", () => { hover = link.matches(":focus-visible"); });
    link.addEventListener("blur", () => { hover = false; });

    // Draw the name into two masks at dither resolution: the letters, and a soft glow around them
    function layout() {
      CELL = innerWidth < 640 ? 2 : 3;
      // A hidden tab or iframe can report a zero-size window; keep at least one cell
      W = Math.max(1, Math.ceil(innerWidth / CELL));
      H = Math.max(1, Math.ceil(innerHeight / CELL));
      canvas.width = W;
      canvas.height = H;
      img = ctx.createImageData(W, H);

      const off = document.createElement("canvas");
      off.width = W;
      off.height = H;
      const o = off.getContext("2d", { willReadFrequently: true });

      // One line on wide screens, stacked on narrow ones
      const lines = W / H > 1.1 ? [NAME] : NAME.split(" ");
      o.font = `800 100px ${FONT}`;
      const widest = Math.max(...lines.map((l) => o.measureText(l).width));
      const size = Math.min((W * 0.84) / widest * 100, (H * 0.62) / lines.length);
      o.font = `800 ${size}px ${FONT}`;
      o.textAlign = "center";
      o.textBaseline = "middle";
      const lineY = (i) => H / 2 + (i - (lines.length - 1) / 2) * size * 1.1;

      // The label goes just under the name, flush with its left edge (the widest line's ink)
      const left = Math.min(...lines.map((l) => W / 2 - o.measureText(l).actualBoundingBoxLeft));
      const bottom = lineY(lines.length - 1) + o.measureText(lines[lines.length - 1]).actualBoundingBoxDescent;

      // Draw the label into its own mask, thresholded so the small text stays crisp
      o.font = `italic ${LABEL_SIZE}px ${LABEL_FONT}`;
      o.textAlign = "left";
      const tx = Math.round(left), ty = Math.round(bottom + 12 + LABEL_SIZE / 2);
      o.fillStyle = "#000";
      o.fillRect(0, 0, W, H);
      o.fillStyle = "#fff";
      o.fillText(LABEL, tx, ty);
      const ld = o.getImageData(0, 0, W, H).data;
      label = new Uint8Array(W * H);
      for (let i = 0; i < label.length; i++) label[i] = ld[i * 4] > 110 ? 1 : 0;

      // The invisible link covers the label plus some padding, so it's an easy target
      const pad = Math.round(LABEL_SIZE * 0.5);
      link.style.left = `${(tx - pad) * CELL}px`;
      link.style.top = `${(ty - LABEL_SIZE / 2 - pad) * CELL}px`;
      link.style.width = `${(o.measureText(LABEL).width + 2 * pad) * CELL}px`;
      link.style.height = `${(LABEL_SIZE + 2 * pad) * CELL}px`;
      link.style.display = "block";

      o.font = `800 ${size}px ${FONT}`;
      o.textAlign = "center";

      const draw = (blur) => {
        o.fillStyle = "#000";
        o.fillRect(0, 0, W, H);
        o.fillStyle = "#fff";
        o.shadowColor = "#fff";
        o.shadowBlur = blur;
        lines.forEach((l, i) => o.fillText(l, W / 2, lineY(i)));
        const d = o.getImageData(0, 0, W, H).data;
        const out = new Float32Array(W * H);
        for (let i = 0; i < out.length; i++) out[i] = d[i * 4] / 255;
        return out;
      };
      core = draw(0);
      halo = draw(size * 0.35);
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function frame(t) {
      requestAnimationFrame(frame);
      if (!core) return;
      const time = reduce ? 0 : t / 1000;
      const px = img.data;
      const { ink: INK, paper: PAPER, grain, glow, letter: letterBase, band: bandAmount } = theme;
      // A slow diagonal band of light sweeps across the letters
      const sweep = (time * 0.18) % 1.6 - 0.3;
      for (let y = 0; y < H; y++) {
        const brow = BAYER[y & 7];
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          // The label is shaded like the name (same gradient, band and ripple); hovered, it goes solid
          const l = label[i];
          const c = l ? 1 : core[i], h = halo[i];

          // Paper is near white with a faint vertical falloff; the glow darkens around the letters
          let lum = 1.01 - grain * (y / H) ** 2 - glow * h * (1 - c);
          if (c > 0) {
            const u = (x / W) * 0.8 + (y / H) * 0.5;
            const band = Math.exp(-((u - sweep) ** 2) / 0.012);
            const ripple = 0.06 * Math.sin(x * 0.09 + y * 0.05 + time * 1.3);
            const letter = letterBase + 0.28 * (y / H) + bandAmount * band + ripple;
            lum = lum * (1 - c) + letter * c;
          }

          if (l && hover) lum = 0;

          const ink = lum < brow[x & 7];
          const col = ink ? INK : PAPER;
          const p = i * 4;
          px[p] = col[0];
          px[p + 1] = col[1];
          px[p + 2] = col[2];
          px[p + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 100);
    });

    // Wait for the fonts so the canvas doesn't draw in a fallback face
    Promise.all([
      document.fonts.load(`800 100px ${FONT}`),
      document.fonts.load(`italic 16px ${LABEL_FONT}`),
    ]).finally(layout);
    requestAnimationFrame(frame);
  </script>
</body>

</html>
