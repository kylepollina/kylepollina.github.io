<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kyle pollina</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Fraunces, SIL Open Font License: https://fonts.google.com/specimen/Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&display=block" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ece8dc;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: none;
      touch-action: none;
    }
    /* The name is drawn on the canvas; this copy is for screen readers and search */
    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>

<body>
  <h1>kyle pollina</h1>
  <canvas id="c"></canvas>

  <script>
    const NAME = "kyle pollina";
    const FONT = "Fraunces";
    const INK = [17, 17, 17];
    const PAPER = [236, 232, 220];
    let CELL = 3;              // screen pixels per dither pixel (2 on phones, set in layout)
    const BALL = 120;          // ball radius in screen pixels

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    // 8x8 Bayer matrix for the ordered dither everywhere outside the ball
    const BAYER = (() => {
      let m = [[0]];
      while (m.length < 8) {
        const n = m.length, next = [];
        for (let y = 0; y < n * 2; y++) {
          next.push([]);
          for (let x = 0; x < n * 2; x++) {
            const base = 4 * m[y % n][x % n];
            next[y].push(base + [0, 2, 3, 1][(y < n ? 0 : 2) + (x < n ? 0 : 1)]);
          }
        }
        m = next;
      }
      return m.map((row) => row.map((v) => (v + 0.5) / 64));
    })();

    // 4x4 clustered-dot matrix: inside the ball the dither turns into round halftone dots
    const HALFTONE = [
      [12, 5, 6, 13],
      [4, 0, 1, 7],
      [11, 3, 2, 8],
      [15, 10, 9, 14],
    ].map((row) => row.map((v) => (v + 0.5) / 16));

    let W, H, img, core, halo;

    // Draw the name into two masks at dither resolution: the letters, and a soft glow around them
    function layout() {
      CELL = innerWidth < 640 ? 2 : 3;
      // A hidden tab or iframe can report a zero-size window; keep at least one cell
      W = Math.max(1, Math.ceil(innerWidth / CELL));
      H = Math.max(1, Math.ceil(innerHeight / CELL));
      canvas.width = W;
      canvas.height = H;
      img = ctx.createImageData(W, H);

      const off = document.createElement("canvas");
      off.width = W;
      off.height = H;
      const o = off.getContext("2d", { willReadFrequently: true });

      // One line on wide screens, stacked on narrow ones
      const lines = W / H > 1.1 ? [NAME] : NAME.split(" ");
      o.font = `800 100px ${FONT}`;
      const widest = Math.max(...lines.map((l) => o.measureText(l).width));
      const size = Math.min((W * 0.84) / widest * 100, (H * 0.62) / lines.length);
      o.font = `800 ${size}px ${FONT}`;
      o.textAlign = "center";
      o.textBaseline = "middle";

      const draw = (blur) => {
        o.fillStyle = "#000";
        o.fillRect(0, 0, W, H);
        o.fillStyle = "#fff";
        o.shadowColor = "#fff";
        o.shadowBlur = blur;
        lines.forEach((l, i) => o.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * size * 1.1));
        const d = o.getImageData(0, 0, W, H).data;
        const out = new Float32Array(W * H);
        for (let i = 0; i < out.length; i++) out[i] = d[i * 4] / 255;
        return out;
      };
      core = draw(0);
      halo = draw(size * 0.35);
    }

    // Mouse state: the ball eases toward the pointer and grows in/out as it enters/leaves
    const ptr = { x: innerWidth / 2, y: innerHeight * 0.75, on: false };
    const ball = { x: ptr.x, y: ptr.y, r: 0, invert: 0 };
    addEventListener("pointermove", (e) => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; });
    addEventListener("pointerdown", (e) => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; });
    document.addEventListener("pointerleave", () => { ptr.on = false; });
    addEventListener("blur", () => { ptr.on = false; });

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function frame(t) {
      requestAnimationFrame(frame);
      if (!core) return;
      const time = reduce ? 0 : t / 1000;
      ball.x += (ptr.x - ball.x) * 0.22;
      ball.y += (ptr.y - ball.y) * 0.22;
      ball.r += ((ptr.on ? BALL : 0) - ball.r) * 0.15;

      const bx = ball.x / CELL, by = ball.y / CELL, br = ball.r / CELL;
      // Over the letters the ball flips ink and paper; the flip fades in as a dithered crossfade
      const ci = Math.floor(by) * W + Math.floor(bx);
      const over = ptr.on && (core[ci] > 0.5 || halo[ci] > 0.6) ? 1 : 0;
      ball.invert += (over - ball.invert) * 0.12;

      const px = img.data;
      // A slow diagonal band of light sweeps across the letters
      const sweep = (time * 0.18) % 1.6 - 0.3;
      for (let y = 0; y < H; y++) {
        const brow = BAYER[y & 7];
        const hrow = HALFTONE[(y >> 1) & 3];
        const dy = y - by;
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          const c = core[i], h = halo[i];

          // Paper is near white with a faint vertical falloff; the glow darkens around the letters
          let lum = 1.01 - 0.07 * (y / H) ** 2 - 0.45 * h * (1 - c);
          if (c > 0) {
            const u = (x / W) * 0.8 + (y / H) * 0.5;
            const band = Math.exp(-((u - sweep) ** 2) / 0.012);
            const ripple = 0.06 * Math.sin(x * 0.09 + y * 0.05 + time * 1.3);
            const letter = 0.06 + 0.28 * (y / H) + 0.55 * band + ripple;
            lum = lum * (1 - c) + letter * c;
          }

          const dx = x - bx;
          const d2 = dx * dx + dy * dy;
          let threshold = brow[x & 7];
          let edge = false;
          if (br > 0.5 && d2 < br * br) {
            const d = Math.sqrt(d2) / br;
            // Shade the inside like a sphere lit from the top left, then swap to halftone dots
            const nz = Math.sqrt(1 - d * d);
            const light = Math.max(0, (-dx / br) * 0.45 + (-dy / br) * 0.55 + nz * 0.7);
            lum = Math.min(1, lum * 0.75 + light * 0.35);
            lum = lum + (1 - 2 * lum) * ball.invert;
            threshold = hrow[(x >> 1) & 3];
            edge = d > 0.96;
          }

          const ink = edge || lum < threshold;
          const col = ink ? INK : PAPER;
          const p = i * 4;
          px[p] = col[0];
          px[p + 1] = col[1];
          px[p + 2] = col[2];
          px[p + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 100);
    });

    // Wait for the font so the canvas doesn't draw the name in a fallback face
    document.fonts.load(`800 100px ${FONT}`).finally(layout);
    requestAnimationFrame(frame);
  </script>
</body>

</html>
