  <style>
    /* An album page: the photos in the order they were taken, stacked in columns */
    header {
      text-align: center;

    header .meta {
      margin-top: 0.4em;
    }
    header .prose {
      margin-top: 1.2em;
    }
    .photos {
      max-width: 72rem;
      margin: 4em auto 0;
      columns: 3;
      column-gap: 12px;
    }
    .photos .photo {
      break-inside: avoid;
      margin-bottom: 12px;
    }
    /* The img's width and height give each photo its shape */
    .photos .photo img {
      height: auto;
    }
    @media (max-width: 760px) {
      .photos {
        columns: 2;
        column-gap: 8px;
      }
      .photos .photo {
        margin-bottom: 8px;
      }
    }
  </style>
